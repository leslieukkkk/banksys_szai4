name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装检查依赖
        run: pip install -r requirements-dev.txt

      - name: 格式检查
        run: ruff format --check .

      - name: 静态检查
        run: ruff check .

      - name: 单元测试 + 覆盖率(门禁 80%)
        run: pytest --cov --cov-fail-under=80

      - name: 模型训练门禁(AUC ≥ 0.80)
        run: python -m ml.train

      - name: Docker 构建检查
        run: docker build -t banksys_szai4:ci .
