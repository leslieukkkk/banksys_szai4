name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步代码并远程部署
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: /opt/banksys_szai4
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 教学环境 DNS/端口情况多样,跳过主机指纹校验以提升稳定性(密钥认证仍是主要安全手段)
          SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_DIR"
          rsync -az --delete --exclude=.git -e "ssh $SSH_OPTS" ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash $DEPLOY_DIR/deploy.sh $SSH_HOST"
